name: Bench

# Builds the app on Arch (libadwaita 1.6 is newer than Ubuntu has), runs the
# unit tests and the bench, including the first minutes of a real AMI meeting,
# and fails when a case scores below bench/thresholds.json. The bench runs in
# two halves side by side: the AMI meeting, and the synthetic cases. The scores
# are kept as an artifact; "Bench comment" posts them on the pull request, also
# for pull requests from forks, which may not write to this repository.

# Documentation alone does not change what the bench measures.
on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes its running bench pointless; on main every
# commit keeps its run.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What needs no build, back in a minute or two, next to the rest.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the checkers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gjs gettext desktop-file-utils appstream

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: What the top bar shows
        run: gjs -m extension/tests/status.test.js

      - name: Translations
        run: |
          for po in app/po/*.po extension/po/*.po; do
            msgfmt --check --statistics -o /dev/null "$po"
          done

      - name: Launcher and software centre data
        run: |
          desktop-file-validate app/data/io.github.gheop.Minutes.desktop
          appstreamcli validate --no-net --explain app/data/io.github.gheop.Minutes.metainfo.xml

  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    env:
      CARGO_HOME: /cache/cargo
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust cmake clang gtk4 libadwaita ffmpeg libpulse xorg-server-xvfb dbus

      - uses: actions/checkout@v7
        with:
          # Nothing here pushes: no token left in the checkout.
          persist-credentials: false

      # Restored and saved as separate steps, so a failing build still keeps
      # the downloads for the next run. Cargo.lock changes with every version
      # of Minutes, so the last build whatever its lock file is taken when
      # there is none for this one: cargo then rebuilds only what changed, not
      # whisper.cpp.
      - name: Restore Cargo and the build
        id: cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            /cache/cargo/registry
            /cache/cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --release

      # After the build, so the dependencies it compiled are reused.
      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings

      # On a virtual screen, so the window test runs instead of skipping.
      - name: Unit tests
        env:
          MINUTES_REQUIRE_DISPLAY: '1'
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a cargo test --release

      # From main only, once per lock file: pull requests read main's cache,
      # and each push no longer adds a few hundred megabytes of it.
      - name: Save Cargo and the build
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            /cache/cargo/registry
            /cache/cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}

      - uses: actions/upload-artifact@v7
        with:
          name: bench-binary
          path: target/release/minutes
          retention-days: 1

  bench:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    strategy:
      # Both halves report even when one falls below its thresholds.
      fail-fast: false
      matrix:
        include:
          - half: ami
            cases: --ami --case ami-ES2004a-import ami-ES2004a-call
          - half: synthetic
            cases: --case call call-speakers import music room silence
    env:
      # The app keeps its models under $XDG_DATA_HOME; a fixed path to cache.
      XDG_DATA_HOME: /cache/data
    steps:
      - name: Install what the app needs to run
        run: pacman -Syu --noconfirm --needed gtk4 libadwaita ffmpeg libpulse python

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore the models and the AMI meeting
        id: models
        uses: actions/cache/restore@v6
        with:
          path: |
            /cache/data/minutes/models
            bench/.cache
          # Change the key when the bench model or the speaker model changes.
          key: models-minutes-small.en-nemotron-353b6f8-ami-ES2004a

      - uses: actions/download-artifact@v8
        with:
          name: bench-binary
          path: target/release

      - name: Bench
        env:
          CASES: ${{ matrix.cases }}
          HALF: ${{ matrix.half }}
        run: |
          set -o pipefail
          chmod +x target/release/minutes
          # small.en keeps a run short on GitHub's four cores; the bench is
          # about who said what, which does not depend on the model.
          # shellcheck disable=SC2086 # CASES holds several arguments
          python3 bench/run.py $CASES --model small.en --check --json "bench-results-$HALF.json" --keep bench-transcripts | tee bench-table.txt
          { echo '```'; cat bench-table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the models and the AMI meeting
        if: ${{ always() && matrix.half == 'ami' && steps.models.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            /cache/data/minutes/models
            bench/.cache
          key: models-minutes-small.en-nemotron-353b6f8-ami-ES2004a

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: results-${{ matrix.half }}
          path: |
            bench-results-${{ matrix.half }}.json
            bench-transcripts
          if-no-files-found: ignore
          # Long enough to look into a regression.
          retention-days: 14

  # The two halves' scores as one table, and for the pull request comment.
  scores:
    needs: bench
    if: ${{ always() && needs.bench.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: halves
          merge-multiple: true

      - name: Merge the scores
        run: |
          python3 - <<'EOF'
          import glob, json
          merged = {"cases": {}, "failures": []}
          for path in sorted(glob.glob("halves/bench-results-*.json")):
              half = json.load(open(path))
              merged["cases"].update(half.get("cases", {}))
              merged["failures"] += half.get("failures", [])
          json.dump(merged, open("bench-results.json", "w"), indent=1)
          EOF

      - name: Keep the scores for the comment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p bench-comment
          echo "$PR_NUMBER" > bench-comment/pr.txt
          echo "$PR_SHA" > bench-comment/sha.txt
          cp bench-results.json bench-comment/

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: bench-comment
          path: bench-comment
          # Read once, by "Bench comment", right after this run.
          retention-days: 1

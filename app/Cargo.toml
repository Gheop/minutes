[package]
name = "minutes"
description = "Meeting recorder and transcriber for GNOME"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel.workspace = true
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
minutes-engine = { path = "../engine" }
serde_json.workspace = true

[features]
default = []
vulkan = ["minutes-engine/vulkan"]
cuda = ["minutes-engine/cuda"]

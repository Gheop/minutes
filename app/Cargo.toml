[package]
name = "omarchy-meeting-recorder"
description = "Meeting recorder: records the mic and the computer audio, transcribes after the call"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel.workspace = true
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libc = "0.2.189"
minutes-engine = { path = "../engine" }
serde_json.workspace = true

[features]
default = []
vulkan = ["minutes-engine/vulkan"]
cuda = ["minutes-engine/cuda"]
